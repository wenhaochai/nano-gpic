# lightning.pytorch==2.6.1
seed_everything: 0
torch_hub_dir: ~/.cache/huggingface/hub/
huggingface_cache_dir: ~/.cache/
trainer:
  accelerator: auto
  strategy: ddp
  devices: '8'
  num_nodes: 1
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: jit_t2i_sampling_gpic_full_390600_cfg_1.75_euler_50_steps
      save_dir: .
      version: null
      offline: false
      dir: null
      id: null
      anonymous: null
      project: JiT_t2i
      log_model: false
      experiment: null
      prefix: ''
      checkpoint_name: null
      add_file_policy: mutable
      entity: null
      notes: null
      tags: null
      config: null
      config_exclude_keys: null
      config_include_keys: null
      allow_val_change: null
      group: null
      job_type: null
      mode: null
      force: null
      reinit: null
      resume: null
      resume_from: null
      fork_from: null
      save_code: null
      tensorboard: null
      sync_tensorboard: null
      monitor_gym: null
      settings: null
  callbacks:
  - class_path: src.callbacks.model_checkpoint.CheckpointHook
    init_args:
      dirpath: null
      filename: null
      monitor: null
      verbose: true
      save_last: true
      save_top_k: -1
      save_on_exception: false
      save_weights_only: false
      mode: min
      auto_insert_metric_name: true
      every_n_train_steps: 7812
      # every_n_train_steps: 1000
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: src.callbacks.save_images.SaveImagesHook
    init_args:
      save_dir: val
      save_compressed: false
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: 400001
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 3906
  # val_check_interval: 390
  check_val_every_n_epoch: null
  num_sanity_val_steps: 1
  log_every_n_steps: 100
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: false
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins:
  - class_path: src.plugins.bd_env.BDEnvironment
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./universal_pix_t2i_workdirs
  enable_autolog_hparams: true
  model_registry: null
model:
  vae:
    class_path: src.models.autoencoder.pixel.PixelAE
    init_args:
      scale: 1.0
      shift: 0.0
  conditioner:
    class_path: src.models.conditioner.qwen3_text_encoder.Qwen3TextEncoder
    init_args:
      weight_path: Qwen/Qwen3-1.7B
      embed_dim: 2048
      max_length: 300
  denoiser:
    class_path: src.models.transformer.JiT_T2I.JiT_T2I
    init_args:
      input_size: 256
      in_channels: 3
      num_groups: 24
      hidden_size: 1536
      num_blocks: 16
      num_text_blocks: 4
      patch_size: 16
      txt_embed_dim: 2048
      # txt_max_length: 128
      txt_max_length: 300
      bottleneck_dim: 256
      weight_path: null
      load_ema: false
  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training_JiT.JiTTrainer
    init_args:
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      loss_weight_fn: src.diffusion.flow_matching.training_JiT.constant
      lognorm_t: true
      timeshift: 1.0
      P_mean: -0.8
      P_std: 0.8
      t_eps: 0.05
      null_condition_p: 0.1
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling.EulerSamplerJiT
    init_args:
      w_scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      timeshift: 1.0
      guidance_interval_min: 0.0
      guidance_interval_max: 1.0
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      last_step: null
      last_step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      num_steps: 50
      # guidance: 4.0
      # guidance: 1.75
      guidance: 4.00
      # guidance: 6.25
  ema_tracker:
    class_path: src.callbacks.simple_ema.SimpleEMA
    init_args:
      decay: 0.9999
      every_n_steps: 1
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 0.0001
      betas:
      - 0.9
      - 0.95
      eps: 1.0e-08
      weight_decay: 0.0
      amsgrad: false
      maximize: false
      foreach: null
      capturable: false
      differentiable: false
      fused: null
  lr_scheduler:
    class_path: src.utils.lr_scheduler.WarmupFlatCooldown
    init_args:
      num_warmup_steps: 4000
      num_cooldown_steps: 4000
      max_steps: 400000
  eval_original_model: false
  sample_every: 5000
data:
  train_dataset:
    class_path: src.data.dataset.gpic_dataset.GPICWebDataset
    init_args:
      tar_dir: path_to_your_gpic_shards/
      tar_pattern: gpic_train_{00000..00799}.tar
      shuffle_buffer: 100
      corrupted_csv: null
      output_fields:
      - image
      - caption
      - caption_type
  eval_dataset:
    class_path: src.data.dataset.geneval.GenEvalDataset
    init_args:
      meta_json_path: ./evaluations/geneval/evaluation_metadata.jsonl
      num_samples_per_instance: 4
      latent_shape:
      - 3
      - 256
      - 256
  pred_dataset:
    class_path: src.data.dataset.gpic_jsonl_dataset.GPICJsonlDataset
    init_args:
      jsonl_path: path_to_your_gpic/gpic_eval_50k.jsonl # Update this
      num_samples_per_instance: 1   # or 4 if you want multiple samples per prompt
      latent_shape:
      - 3
      - 256
      - 256
  pred_batch_size: 8
  pred_num_workers: 1
  # --- GPIC: val dataset for loss-based validation (dataloader_idx=0) ---
  val_dataset:
    class_path: src.data.dataset.gpic_dataset.GPICWebDataset
    init_args:
      tar_dir: path_to_your_gpic/gpic/gpic_val_tars/ # Change this
      tar_pattern: gpic_val_{00000..00031}.tar
      shuffle_buffer: 100
      corrupted_csv: null
      is_val: true
      output_fields:
      - image
      - caption
      - caption_type
  val_batch_size: 32 # 32*2
  val_num_workers: 8
  # --- end GPIC ---
  train_batch_size: 32 # 32*2
  train_num_workers: 64
  train_prefetch_factor: 0
  eval_batch_size: 32 # 32*2
  eval_num_workers: 1
  pred_batch_size: 32
  pred_num_workers: 1
tags:
  exp: jit_t2i_sampling_gpic_full_390600_cfg_1.75_euler_50_steps
ckpt_path: null
weights_only: null