# lightning.pytorch==2.6.1
seed_everything: 0
torch_hub_dir: /scratch/gpfs/GROUP/USER/.cache/torch/hub
huggingface_cache_dir: /scratch/gpfs/GROUP/USER/cache/huggingface/hub
trainer:
  accelerator: auto
  strategy:   # perf C2: no buffer broadcast; gradients are views of the DDP buckets
    class_path: lightning.pytorch.strategies.DDPStrategy
    init_args:
      broadcast_buffers: false
      gradient_as_bucket_view: true
  devices: '8'
  num_nodes: 1
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: ladder
      save_dir: .
      version: null
      offline: false
      dir: null
      id: null
      anonymous: null
      project: gpic-speed
      log_model: false
      experiment: null
      prefix: ''
      checkpoint_name: null
      add_file_policy: mutable
      entity: null
      notes: null
      tags: null
      config: null
      config_exclude_keys: null
      config_include_keys: null
      allow_val_change: null
      group: null
      job_type: null
      mode: null
      force: null
      reinit: null
      resume: allow
      resume_from: null
      fork_from: null
      save_code: null
      tensorboard: null
      sync_tensorboard: null
      monitor_gym: null
      settings: null
  callbacks:
  - class_path: src.callbacks.model_checkpoint.CheckpointHook
    init_args:
      filename: resume-{step:06d}
      monitor: null
      save_last: true
      save_top_k: 0
      every_n_train_steps: 2500
  - class_path: src.callbacks.model_checkpoint.CheckpointHook
    init_args:
      filename: ms-{step:06d}
      monitor: null
      save_last: false
      save_top_k: -1
      every_n_train_steps: 10000
  - class_path: src.callbacks.compile_warmup.CompileWarmup
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: 100000   # set per run
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: 0
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 1000000000
  # val_check_interval: 390
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  enable_checkpointing: null
  enable_progress_bar: false
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: false
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins:
  - class_path: src.plugins.bd_env.BDEnvironment
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: /scratch/gpfs/GROUP/USER/runs/gpic-speed
  enable_autolog_hparams: true
  model_registry: null
model:
  vae:
    class_path: src.models.autoencoder.pixel.PixelAE
    init_args:
      scale: 1.0
      shift: 0.0
  conditioner:
    class_path: src.models.conditioner.qwen3_text_encoder.Qwen3TextEncoder
    init_args:
      weight_path: Qwen/Qwen3-1.7B
      embed_dim: 2048
      max_length: 320
      text_mode: masked   # ladder option B: pad to the batch's longest caption, mask the padding
      pad_multiple: 8
      # the official kernel. FlexAttention (perf C6) compiles minutes per new T on each rank, in turn (w916); at T ~ 50
      # its gain is small
      attn_implementation: sdpa
  denoiser:
    class_path: src.models.transformer.JiT_T2I.JiT_T2I
    init_args:
      input_size: 256
      in_channels: 3
      num_groups: 24
      hidden_size: 1536
      num_blocks: 16
      num_text_blocks: 4
      patch_size: 16
      txt_embed_dim: 2048
      # txt_max_length: 128
      txt_max_length: 320
      bottleneck_dim: 256
      weight_path: null
      load_ema: false
  # diffusion_trainer:
  #   class_path: src.diffusion.flow_matching.training_JiT.JiTTrainer
  #   init_args:
  #     scheduler:
  #       class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
  #     loss_weight_fn: src.diffusion.flow_matching.training_JiT.constant
  #     lognorm_t: true
  #     timeshift: 1.0
  #     P_mean: -0.8
  #     P_std: 0.8
  #     t_eps: 0.05
  #     null_condition_p: 0.1
  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training_JiT.JiTTrainer
    init_args:
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      loss_weight_fn: src.diffusion.flow_matching.training_JiT.constant
      lognorm_t: true
      timeshift: 1.0
      P_mean: -0.8
      P_std: 0.8
      t_eps: 0.05
      null_condition_p: 0.1
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling.EulerSamplerJiT
    init_args:
      w_scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      timeshift: 1.0
      guidance_interval_min: 0.0
      guidance_interval_max: 1.0
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      last_step: null
      last_step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      num_steps: 100
      guidance: 4.0
  ema_tracker:
    class_path: src.callbacks.simple_ema.SimpleEMA
    init_args:
      decay: 0.9999
      every_n_steps: 1
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 0.0001
      betas:
      - 0.9
      - 0.95
      eps: 1.0e-08
      weight_decay: 0.0
      amsgrad: false
      maximize: false
      foreach: null
      capturable: false
      differentiable: false
      fused: true   # perf C3
  lr_scheduler:
    class_path: src.utils.lr_scheduler.WarmupFlatCooldown
    init_args:
      num_warmup_steps: 4000
      num_cooldown_steps: 4000
      # flat after warmup in every ladder run (owner-approved plan). The reference's 400000 would start the cooldown
      # inside d640's 516k steps and make the LR negative after step 400000 (1 - (step - 396000)/4000).
      max_steps: 1000000000
  eval_original_model: false
  sample_every: 0
data:
  train_dataset:
    class_path: src.data.dataset.gpic_dataset.GPICWebDataset
    init_args:
      tar_dir: /scratch/gpfs/GROUP/USER/data/gpic/train/
      tar_pattern: gpic_train_{00000..00800}.tar
      shuffle_buffer: 100
      group_text_len: true   # ladder option B: captions tokenized in the workers, batches grouped by length
      group_window: 1024
      text_max_length: 320
      pad_multiple: 8
      corrupted_csv: null
      output_fields:
      - image
      - caption
      - caption_type
  eval_dataset:
    class_path: src.data.dataset.geneval.GenEvalDataset
    init_args:
      meta_json_path: ./evaluations/geneval/evaluation_metadata.jsonl
      num_samples_per_instance: 4
      latent_shape:
      - 3
      - 256
      - 256
  pred_dataset:
    class_path: src.data.dataset.geneval.GenEvalDataset
    init_args:
      meta_json_path: ./evaluations/geneval/evaluation_metadata_gpic.jsonl
      num_samples_per_instance: 4
      latent_shape:
      - 3
      - 256
      - 256
  # --- GPIC: val dataset for loss-based validation (dataloader_idx=0) ---
  val_dataset:
    class_path: src.data.dataset.gpic_dataset.GPICWebDataset
    init_args:
      tar_dir: /scratch/gpfs/GROUP/USER/data/gpic/val/
      tar_pattern: gpic_val_{00000..00031}.tar
      shuffle_buffer: 100
      corrupted_csv: null
      is_val: true
      output_fields:
      - image
      - caption
      - caption_type
  val_batch_size: 32 # 32*2
  val_num_workers: 8
  # --- end GPIC ---
  train_batch_size: 32 # 32*2
  train_num_workers: 32 # oriignally 64 but reduced to 32
  train_prefetch_factor: 0
  eval_batch_size: 32 # 32*2
  eval_num_workers: 1
  pred_batch_size: 8
  pred_num_workers: 1
tags:
  exp: ladder
ckpt_path: null
weights_only: null