# Overlay on lite_ladder_sample.yaml: the implicit sampler. num_steps = network calls per image.
model:
  denoiser:
    init_args:
      xi_dim: 64
      xi_block: 6
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling_implicit.ImplicitSampler
    init_args:
      w_scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      timeshift: 1.0
      guidance_interval_min: 0.0
      guidance_interval_max: 1.0
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      last_step: null
      last_step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      num_steps: 50
      guidance: 1.0
