# Overlay on lite_ladder_sample.yaml: the owner's draw sampler (docs/gmflow.md section 14): at every call one x0 per pixel drawn from the mixture, then the straight step along its velocity, no fresh noise. gm_k comes from the command line (jobs/eval_gmflow.sh); with gm_k 0 it is the exact one step.
# num_steps = network calls per image. The last step returns the draw.
model:
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling_gmflow.GMDrawSampler
    init_args:
      w_scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      timeshift: 1.0
      guidance_interval_min: 0.0
      guidance_interval_max: 1.0
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      last_step: null
      last_step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      num_steps: 50
      guidance: 1.0
