# Overlay on lite_ladder_sample.yaml: GM-SDE, first order (docs/gmflow.md). gm_k comes from the command line (jobs/eval_gmflow.sh); with gm_k 0 it is DDPM with the small variance.
# num_steps = network calls per image. final_mean true: the last step returns the mixture mean instead of a draw.
model:
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling_gmflow.GMSDESampler
    init_args:
      w_scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      timeshift: 1.0
      guidance_interval_min: 0.0
      guidance_interval_max: 1.0
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      last_step: null
      last_step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      num_steps: 50
      guidance: 1.0
      final_mean: false
