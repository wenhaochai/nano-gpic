# Overlay on lite_ladder_sample.yaml: the DTM sampler (docs/dtm_ladder.md; sampling_dtm.DTMDrawSampler): at every call the flow head draws each patch
# by its probabilities and the state takes the straight step, no fresh noise. num_steps = backbone calls per image. The last step returns the draw.
model:
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling_dtm.DTMDrawSampler
    init_args:
      w_scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      timeshift: 1.0
      guidance_interval_min: 0.0
      guidance_interval_max: 1.0
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      last_step: null
      last_step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      num_steps: 50
      guidance: 1.0
