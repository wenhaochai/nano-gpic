# Overlay on lite_ladder.yaml: the energy head (docs/energy_head.md), lambda 0.5, no caption dropout. main.py fit --config lite_ladder.yaml --config this.
model:
  denoiser:
    init_args:
      head_width: 352    # the small noisy head (docs/energy_head.md): backbone once per x_t, head per sample
  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training_implicit.ImplicitJiTTrainer
    init_args:
      scheduler:
        class_path: src.diffusion.flow_matching.scheduling.LinearScheduler
      loss_weight_fn: src.diffusion.flow_matching.training_JiT.constant
      lognorm_t: true
      timeshift: 1.0
      P_mean: -0.8
      P_std: 0.8
      t_eps: 0.05
      null_condition_p: 0.0   # owner 2026-11-04: no CFG, so no caption dropout
      samples: 2
      beta: 1.0
      lam: 0.5
