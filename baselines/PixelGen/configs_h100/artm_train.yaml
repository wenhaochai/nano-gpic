# ARTM on the final ladder (docs/artm_ladder.md; artm-ladder, owner popups 2026-11-13: ARTM-3 at d10, d12, d14). Overlay after configs_h100/muon_ladder.yaml
# (jobs/train_artm_ladder.sh): the backbone, optimizer and recipe stay the ladder's; the model reads X_k and X_{k+1} (T = 3 transitions, the independent linear
# process) with a causal mask, and a TokenFlowHead (width 1024, 3 blocks) draws each patch. The attention needs the SDPA path (GPIC_MFU_ATTN=sdpa).
model:
  denoiser:
    class_path: src.models.transformer.ARTM_JiT.ARTMJiT
    init_args:
      art_T: 3
      art_head_width: 1024
      art_head_depth: 3
      art_head_steps: 32
      art_t_eps: 0.05
  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training_artm.ARTMTrainer
    init_args:
      head_P_mean: -0.8
      head_P_std: 1.6
      t_eps: 0.05
      null_condition_p: 0.0   # owner 2026-11-04: no CFG, so no caption dropout
